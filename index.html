<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTENZA</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;

background-image:url('Designer.png');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;
}

header{
background:black;
color:gold;
text-align:center;
padding:30px;
}

header img{
width:150px;
}

.hero{
background:#111;
color:white;
text-align:center;
padding:80px 20px;
}

.btn{
display:inline-block;
background:#25D366;
color:green;
padding:12px 25px;
text-decoration:none;
border-radius:5px;
margin-top:15px;
font-weight:bold;
}

.products{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
padding:40px 20px;
}
.card{
background:rgba(255,255,255,0.9);
width:250px;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
text-align:center;
}


footer{
background:black;
color:white;
text-align:center;
padding:20px;
}
</style>
</head>

<body>

<header>
<img src="Designer.png" alt="Footenza Logo">
<h1>FOOTENZA</h1>
<p>Step Into Style</p>
</header>

<section class="hero">
<h1>Premium Shoes Collection</h1>
<p>Stylish, Comfortable & Affordable Shoes</p>

<a class="btn"
href="https://wa.me/923196179029"
target="_blank">
Order on WhatsApp
</a>
</a>

</section>

<section class="products">

<div class="card">
<h3>Sports Shoes</h3>
<p>Rs. 3,999</p>
</div>

<div class="card">
<h3>Casual Shoes</h3>
<p>Rs. 2,999</p>
</div>

<div class="card">
<h3>Running Shoes</h3>
<p>Rs. 6,999</p>
</div>

</section>

<footer>
© FOOTENZA
</footer>

</body>
</html>
